name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run irrelevant, but never interrupt a
  # deploy — cancelling one mid-restart leaves the server on a half-shipped tree.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.upload.outputs.artifact-id }}
      release-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The release must match the production host's Node major and ABI;
      # deploy/unpack-release.py rejects any other build runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Covers src and test together; the build config alone would not see the
      # tests, and a test that no longer compiles is a test that stopped running.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test release validation
        run: python3 -m unittest discover -s test -p 'deploy_release_test.py'

      - name: FastAPI contract tests
        run: pip install --no-cache-dir "./api[dev]" && python3 -m pytest -q api/tests

      - name: Verify no secret is committed
        run: |
          set -euo pipefail
          # Neither matched content nor scanner stderr may enter workflow logs.
          files=$(git ls-files 2>/dev/null) || { echo '::error::Secret scanner file enumeration failed.'; exit 2; }
          status=0
          grep -iE '(^|/)\.env($|\.)|adminsdk|service-account|\.pem$|\.p12$' <<< "$files" >/dev/null 2>&1 || status=$?
          case "$status" in
            0) echo '::error::A credential-shaped file is tracked by git.'; exit 1 ;;
            1) ;;
            *) echo '::error::Secret scanner filename check failed.'; exit 2 ;;
          esac
          # Equivalent patterns avoid matching their own definitions; .github is covered.
          status=0
          git grep -lIE 'sk[_]live_|sk[_]test_|whsec[_]|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . >/dev/null 2>&1 || status=$?
          case "$status" in
            0) echo '::error::A credential-shaped string is committed.'; exit 1 ;;
            1) ;;
            *) echo '::error::Secret scanner content check failed.'; exit 2 ;;
          esac
          echo "No tracked secrets."

      - name: Package the checked release without production credentials
        id: package
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          mkdir "$release"
          cp package.json package-lock.json "$release/"
          npm ci --prefix "$release" --omit=dev --ignore-scripts --no-audit --no-fund
          (cd "$release" && node --input-type=module -e 'import fs from "node:fs"; const names = Object.keys(JSON.parse(fs.readFileSync("package.json", "utf8")).dependencies); for (const name of names) await import(name);')
          cp -R dist "$release/dist"
          mkdir "$release/deploy"
          cp deploy/exchange-directories.py "$release/deploy/"
          python3 deploy/unpack-release.py --metadata "$GITHUB_SHA" > "$release/release.json"
          # Dereference npm's internal links; the receiver rejects all links.
          tar --dereference --hard-dereference -czf "$RUNNER_TEMP/release.tar.gz" -C "$release" package.json package-lock.json release.json dist node_modules deploy
          digest=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)
          python3 deploy/unpack-release.py "$RUNNER_TEMP/release.tar.gz" "$digest" "$GITHUB_SHA" --check-only
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable release
        id: upload
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Lets you require a manual approval on the environment in repo settings,
    # and stops two pushes deploying over each other.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # A fresh hosted runner: no npm, build, tests or application imports here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require an exact release reference
        env:
          RELEASE_ID: ${{ needs.check.outputs.release-id }}
          RELEASE_SHA256: ${{ needs.check.outputs.release-sha256 }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.check.outputs.release-id }}
          path: ${{ runner.temp }}/deployment
          merge-multiple: true

      - name: Authorise SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than scanned: ssh-keyscan would trust whatever answers.
          printf '%s\n' '194.164.94.249 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDrhAwZfwcoFmqQvzT2oN/UXV1dKnYOn13kOdAvto86x' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: preet@194.164.94.249
          RELEASE_SHA256: ${{ needs.check.outputs.release-sha256 }}
        run: bash deploy.sh "$RUNNER_TEMP/deployment/release.tar.gz" "$RELEASE_SHA256" "$GITHUB_SHA"

      - name: Remove the deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Confirm the API is serving
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api.lotusbuild.co.uk/health)
          test "$code" = "200" || { echo "::error::health returned $code"; exit 1; }
          echo "Live and healthy."
